<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030812">
<title>Autonomous Tycoon</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<canvas id="world" aria-label="Isometric command hub: tap a building"></canvas>
<div class="hud" id="kpi"></div>
<div class="hud" id="legend"><span class="demo">DEMO DATA</span><br>▮ height = revenue · <span class="ok">green</span> profit · <span class="no">red</span> loss<br>tap a tower · drag · pinch</div>
<div class="ctl"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="fit" aria-label="Recenter">⌖</button><button data-layer="flow" class="on" aria-label="Toggle money flow">$</button></div>
<div class="hud" id="panel" role="region" aria-live="polite"></div>
<nav class="dock" id="dock"><button data-m="city" class="on">◈ CITY</button><button data-m="biz">▦ BIZ</button><button data-m="agents">⚙ AGENTS</button><button data-m="money">$ MONEY</button><button data-m="todo">! TODO</button><button data-m="log">≡ LOG</button></nav>
<script type="module" src="/js/main.js"></script>
</body>
</html>
